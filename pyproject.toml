[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wit-ble5"
version = "0.1.0"
description = "Cross-platform BLE client for WitMotion BLE 5.0 sensors (WT9011DCL-BT50 / WT901BLE)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xinwei" }]
keywords = [
  "witmotion",
  "ble",
  "imu",
  "wt9011dcl",
  "bluetooth",
  "ahrs",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
  "bleak>=0.22.0",
  "PySide6-Essentials>=6.6.0",
  "pyqtgraph>=0.13.3",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/OWNER/wit_ble5"
Documentation = "https://github.com/OWNER/wit_ble5#readme"
Repository = "https://github.com/OWNER/wit_ble5"
Issues = "https://github.com/OWNER/wit_ble5/issues"
Changelog = "https://github.com/OWNER/wit_ble5/blob/main/CHANGELOG.md"

[project.scripts]
wit-ble5 = "wit_ble5.cli:main"
wit-ble5-gui = "wit_ble5.gui.app:main"

[tool.setuptools.packages.find]
include = ["wit_ble5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["wit_ble5", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # line length handled by formatter preference
]
